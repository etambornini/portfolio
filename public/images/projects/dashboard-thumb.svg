<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#gradient2)"/>
  <defs>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dashboard elements -->
  <rect x="50" y="50" width="300" height="180" rx="8" fill="white" opacity="0.9"/>
  
  <!-- Chart bars -->
  <rect x="80" y="150" width="20" height="40" fill="#4facfe"/>
  <rect x="110" y="130" width="20" height="60" fill="#4facfe"/>
  <rect x="140" y="140" width="20" height="50" fill="#4facfe"/>
  <rect x="170" y="120" width="20" height="70" fill="#4facfe"/>
  
  <!-- Pie chart -->
  <circle cx="280" cy="130" r="30" fill="none" stroke="#4facfe" stroke-width="8" stroke-dasharray="60 30" transform="rotate(-90 280 130)"/>
  <circle cx="280" cy="130" r="30" fill="none" stroke="#00f2fe" stroke-width="8" stroke-dasharray="30 60" stroke-dashoffset="-60" transform="rotate(-90 280 130)"/>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="3" fill="#4facfe"/>
  <circle cx="120" cy="80" r="3" fill="#00f2fe"/>
  <circle cx="140" cy="80" r="3" fill="#4facfe"/>
  
  <text x="200" y="260" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Analytics Dashboard</text>
</svg>