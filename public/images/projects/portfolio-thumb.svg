<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#gradient5)"/>
  <defs>
    <linearGradient id="gradient5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Browser window -->
  <rect x="50" y="60" width="300" height="180" rx="8" fill="white" opacity="0.95"/>
  
  <!-- Browser header -->
  <rect x="50" y="60" width="300" height="30" rx="8" fill="#f8f9fa"/>
  <circle cx="70" cy="75" r="4" fill="#ff5f56"/>
  <circle cx="85" cy="75" r="4" fill="#ffbd2e"/>
  <circle cx="100" cy="75" r="4" fill="#27ca3f"/>
  
  <!-- Portfolio content -->
  <circle cx="150" cy="130" r="20" fill="#fcb69f"/>
  <rect x="190" y="120" width="80" height="8" rx="4" fill="#ffecd2"/>
  <rect x="190" y="135" width="60" height="6" rx="3" fill="#fcb69f" opacity="0.7"/>
  
  <!-- Project cards -->
  <rect x="70" y="160" width="40" height="30" rx="4" fill="#fcb69f" opacity="0.8"/>
  <rect x="120" y="160" width="40" height="30" rx="4" fill="#ffecd2" opacity="0.8"/>
  <rect x="170" y="160" width="40" height="30" rx="4" fill="#fcb69f" opacity="0.8"/>
  
  <!-- 3D elements -->
  <polygon points="280,120 320,100 320,140 280,160" fill="white" opacity="0.6"/>
  <polygon points="320,100 340,110 340,150 320,140" fill="white" opacity="0.4"/>
  
  <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">3D Portfolio</text>
</svg>