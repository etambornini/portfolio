<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#gradient6)"/>
  <defs>
    <linearGradient id="gradient6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Server racks -->
  <rect x="80" y="80" width="60" height="120" rx="4" fill="white" opacity="0.9"/>
  <rect x="160" y="100" width="60" height="100" rx="4" fill="white" opacity="0.8"/>
  <rect x="240" y="90" width="60" height="110" rx="4" fill="white" opacity="0.85"/>
  
  <!-- Server details -->
  <rect x="90" y="90" width="40" height="4" fill="#667eea"/>
  <rect x="90" y="100" width="40" height="4" fill="#764ba2"/>
  <rect x="90" y="110" width="40" height="4" fill="#667eea"/>
  
  <rect x="170" y="110" width="40" height="4" fill="#667eea"/>
  <rect x="170" y="120" width="40" height="4" fill="#764ba2"/>
  
  <rect x="250" y="100" width="40" height="4" fill="#667eea"/>
  <rect x="250" y="110" width="40" height="4" fill="#764ba2"/>
  <rect x="250" y="120" width="40" height="4" fill="#667eea"/>
  
  <!-- Connection lines -->
  <line x1="140" y1="140" x2="160" y2="140" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="220" y1="140" x2="240" y2="140" stroke="white" stroke-width="2" opacity="0.8"/>
  
  <!-- API endpoints -->
  <circle cx="50" cy="50" r="8" fill="white" opacity="0.7"/>
  <circle cx="350" cy="60" r="8" fill="white" opacity="0.7"/>
  <circle cx="30" cy="250" r="8" fill="white" opacity="0.7"/>
  <circle cx="370" cy="240" r="8" fill="white" opacity="0.7"/>
  
  <!-- Docker containers -->
  <rect x="320" y="120" width="20" height="15" rx="2" fill="white" opacity="0.6"/>
  <rect x="345" y="125" width="20" height="15" rx="2" fill="white" opacity="0.6"/>
  <rect x="330" y="145" width="20" height="15" rx="2" fill="white" opacity="0.6"/>
  
  <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Microservices API</text>
</svg>