<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#gradient1)"/>
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shopping cart icon -->
  <g transform="translate(150, 100)">
    <rect x="10" y="20" width="80" height="60" rx="4" fill="white" opacity="0.9"/>
    <circle cx="25" cy="90" r="5" fill="white"/>
    <circle cx="75" cy="90" r="5" fill="white"/>
    <path d="M10 20 L20 20 L25 50 L85 50 L90 30 L30 30" stroke="white" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="20" fill="white" opacity="0.1"/>
  <circle cx="350" cy="250" r="30" fill="white" opacity="0.1"/>
  <rect x="300" y="30" width="15" height="15" fill="white" opacity="0.2" rx="2"/>
  
  <text x="200" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">E-Commerce</text>
</svg>