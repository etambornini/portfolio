<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#gradient3)"/>
  <defs>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone mockup -->
  <rect x="150" y="50" width="100" height="180" rx="15" fill="white" opacity="0.9"/>
  <rect x="160" y="70" width="80" height="140" rx="5" fill="#f8f9fa"/>
  
  <!-- Fitness icons -->
  <g transform="translate(180, 90)">
    <!-- Heart rate -->
    <path d="M20 10 C20 5, 10 5, 10 10 C10 5, 0 5, 0 10 C0 15, 10 25, 10 25 C10 25, 20 15, 20 10 Z" fill="#fa709a"/>
    
    <!-- Steps counter -->
    <rect x="25" y="5" width="15" height="20" rx="2" fill="#fee140"/>
    <circle cx="32" cy="30" r="3" fill="#fee140"/>
    
    <!-- Dumbbell -->
    <rect x="5" y="35" width="30" height="4" rx="2" fill="#fa709a"/>
    <circle cx="5" cy="37" r="4" fill="#fa709a"/>
    <circle cx="35" cy="37" r="4" fill="#fa709a"/>
  </g>
  
  <!-- Progress rings -->
  <circle cx="320" cy="120" r="25" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  <circle cx="320" cy="120" r="25" fill="none" stroke="white" stroke-width="3" stroke-dasharray="100 57" transform="rotate(-90 320 120)"/>
  
  <text x="200" y="260" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Fitness App</text>
</svg>